<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Café Table Reservation (Fixed Form)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style3.css">
</head>
<body class="py-4 py-md-5">
  <div class="container my-auto">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">

        <div class="card cafe-card border-0 shadow-lg">
          <div class="card-header cafe-header p-4 text-center">
            <span class="badge cafe-badge mb-2">Artisan Café &amp; Bistro</span>
            <h1 class="h3 fw-bold text-white mb-1">Reserve a Table</h1>
            <p class="text-white-50 small mb-0">Rebuilt &amp; accessible form compliant with W3C standards</p>
          </div>

          <div class="card-body p-4 p-md-5">
            <form id="reservationForm" action="#" method="post">

              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <label for="userName" class="form-label">Your Name <span class="req">*</span></label>
                  <input type="text" class="form-control" id="userName" name="userName"
                         placeholder="e.g. John Doe" required minlength="2">
                </div>
                <div class="col-12 col-md-6">
                  <label for="userEmail" class="form-label">Email <span class="req">*</span></label>
                  <input type="email" class="form-control" id="userEmail" name="email"
                         placeholder="john@example.com" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <label for="userPhone" class="form-label">Phone <span class="req">*</span></label>
                  <input type="tel" class="form-control" id="userPhone" name="phone"
                         placeholder="+7 701 234 56 78" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="guestsCount" class="form-label">Guests <span class="req">*</span></label>
                  <input type="number" class="form-control" id="guestsCount" name="guests"
                         min="1" max="20" step="1" value="2" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <label for="reservationDate" class="form-label">Date <span class="req">*</span></label>
                  <input type="date" class="form-control" id="reservationDate" name="date" required>
                </div>
                <div class="col-12 col-md-6">
                  <label for="mealType" class="form-label">Meal Time <span class="req">*</span></label>
                  <select class="form-select" id="mealType" name="mealType" required>
                    <option value="" disabled selected>Select dining time...</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <fieldset>
                  <legend class="form-label d-block fs-6 mb-2">Seating Area <span class="req">*</span></legend>
                  <div class="d-flex flex-wrap gap-4">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="inside" checked required>
                      <label class="form-check-label" for="seatingInside">Inside</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="terrace" required>
                      <label class="form-check-label" for="seatingTerrace">Terrace</label>
                    </div>
                  </div>
                </fieldset>
              </div>

              <div class="mb-3">
                <label for="reservationComments" class="form-label">Comments / Special Requests</label>
                <textarea class="form-control" id="reservationComments" name="comments" rows="3"
                          placeholder="Allergies, table preferences, or special celebration details..."></textarea>
              </div>

              <div class="mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agreeTerms" name="terms" required>
                  <label class="form-check-label" for="agreeTerms">
                    I agree to the reservation terms and cancellation policy <span class="req">*</span>
                  </label>
                </div>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-reserve-submit py-3 fw-bold">
                  Reserve Table
                </button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
