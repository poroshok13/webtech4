<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Book a Train Ticket</title>
  <!-- Google Fonts: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style1.css">
</head>
<body class="py-4 py-md-5">
  <div class="container my-auto">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        
        <div class="card ticket-card shadow-sm border-0">
          <!-- Card Header -->
          <div class="card-header ticket-header py-3 px-4">
            <h1 class="h4 mb-0 fw-bold">Book a train ticket</h1>
          </div>

          <!-- Card Body -->
          <div class="card-body p-4 p-md-5">
            <form id="trainForm" action="#" method="get">

              <!-- Trip Type Radio Pills -->
              <div class="mb-4">
                <div class="trip-type-group" role="radiogroup" aria-label="Trip Type">
                  <input type="radio" class="btn-check" name="tripType" id="oneWay" value="one-way" checked>
                  <label class="btn trip-btn" for="oneWay">One way</label>

                  <input type="radio" class="btn-check" name="tripType" id="roundTrip" value="round-trip">
                  <label class="btn trip-btn" for="roundTrip">Round trip</label>
                </div>
              </div>

              <!-- From / To (Floating Labels) -->
              <div class="row g-3 mb-3">
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="fromCity" name="fromCity" placeholder="From" value="Astana" required>
                    <label for="fromCity">From</label>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="toCity" name="toCity" placeholder="To" value="Almaty" required>
                    <label for="toCity">To</label>
                  </div>
                </div>
              </div>

              <!-- Departure / Return / Passengers -->
              <div class="row g-3 mb-4">
                <div class="col-12 col-md-4">
                  <label for="departureDate" class="form-label text-muted small fw-semibold">Departure</label>
                  <input type="date" class="form-control form-control-custom" id="departureDate" name="departureDate" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="returnDate" class="form-label text-muted small fw-semibold">Return</label>
                  <input type="date" class="form-control form-control-custom" id="returnDate" name="returnDate">
                </div>
                <div class="col-12 col-md-4">
                  <label for="passengers" class="form-label text-muted small fw-semibold">Passengers</label>
                  <select class="form-select form-control-custom" id="passengers" name="passengers" required>
                    <option value="1" selected>1 adult</option>
                    <option value="2">2 adults</option>
                    <option value="3">3 adults</option>
                    <option value="4">4 adults</option>
                    <option value="5">5 adults</option>
                    <option value="6">6 adults</option>
                  </select>
                </div>
              </div>

              <!-- Carriage Class Radio Group -->
              <div class="mb-4">
                <label class="form-label text-muted small fw-semibold d-block mb-2">Carriage class</label>
                <div class="d-flex flex-wrap gap-4">
                  <div class="form-check custom-radio">
                    <input class="form-check-input" type="radio" name="carriageClass" id="classSeat" value="seat" required>
                    <label class="form-check-label" for="classSeat">Seat</label>
                  </div>
                  <div class="form-check custom-radio">
                    <input class="form-check-input" type="radio" name="carriageClass" id="classCoupe" value="coupe" checked required>
                    <label class="form-check-label" for="classCoupe">Coupé</label>
                  </div>
                  <div class="form-check custom-radio">
                    <input class="form-check-input" type="radio" name="carriageClass" id="classSleeper" value="sleeper" required>
                    <label class="form-check-label" for="classSleeper">Sleeper</label>
                  </div>
                </div>
              </div>

              <!-- Phone and Email -->
              <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                  <label for="phoneInput" class="form-label text-muted small fw-semibold">Phone</label>
                  <div class="input-group">
                    <span class="input-group-text country-code" id="phonePrefix">+7</span>
                    <input type="tel" class="form-control form-control-custom" id="phoneInput" name="phone" placeholder="701 234 56 78" aria-describedby="phonePrefix" required>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="emailInput" class="form-label text-muted small fw-semibold">Email</label>
                  <input type="email" class="form-control form-control-custom" id="emailInput" name="email" placeholder="name@example.com" required>
                </div>
              </div>

              <!-- Checkboxes -->
              <div class="mb-4">
                <div class="form-check custom-checkbox mb-2">
                  <input class="form-check-input" type="checkbox" id="smsTicket" name="smsTicket">
                  <label class="form-check-label" for="smsTicket">
                    Also send the ticket by SMS
                  </label>
                </div>
                <div class="form-check custom-checkbox">
                  <input class="form-check-input" type="checkbox" id="agreeRules" name="agreeRules" required>
                  <label class="form-check-label" for="agreeRules">
                    I agree with the carriage rules
                  </label>
                </div>
              </div>

              <!-- Action Buttons -->
              <!-- Notice: HTML order has Clear first, Find trains second.
                   On mobile (<sm): Find trains is order-1 (above), Clear is order-2 (below).
                   On desktop (>=sm): Clear is order-sm-1 (left), Find trains is order-sm-2 (right). -->
              <div class="d-flex flex-column flex-sm-row justify-content-sm-end gap-2 pt-2">
                <button type="reset" class="btn btn-ticket-clear order-2 order-sm-1">Clear</button>
                <button type="submit" class="btn btn-ticket-find order-1 order-sm-2">Find trains</button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
